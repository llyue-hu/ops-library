name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: fetch_cache selftest
        working-directory: 04-下载加速与镜像
        run: python fetch_cache.py --selftest

      - name: docset_qa selftest
        working-directory: 09-批量产物结构验收
        run: python docset_qa.py --selftest

      - name: docset_qa on bundled fixture
        working-directory: 09-批量产物结构验收
        run: python docset_qa.py --spec spec.example.json
